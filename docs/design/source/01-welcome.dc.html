<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Where are we eating?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#B33A22}a:hover{color:#8F2D1A}
button,input{font-family:inherit}
button:disabled{opacity:.42;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #17181A;outline-offset:3px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; overflow-y: auto; background: #FAF9F6; color: #17181A; font-family: Manrope, 'Helvetica Neue', Arial, sans-serif">

<header style="height: 32px; flex-shrink: 0; display: flex; align-items: center; gap: 10px">
<span style="width: 32px; height: 32px; border-radius: 10px; background: {{accent}}; display: flex; align-items: center; justify-content: center" aria-hidden="true">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v7a2 2 0 0 0 2 2M9 3v18M11 3v7a2 2 0 0 1-2 2M17 21V3c-2.2 1.2-3.5 3.6-3.5 6.5V13H17"></path></svg>
</span>
<span style="font-size: 17px; font-weight: 800; letter-spacing: -0.01em">[APP NAME]</span>
</header>

<div style="margin-top: 16px; height: 200px; flex-shrink: 0; border-radius: 24px; overflow: hidden; background: #EFE7DC; box-shadow: 0 8px 24px rgba(23, 24, 26, 0.07)">
<sc-if value="{{usePhoto}}" hint-placeholder-val="{{false}}">
<img src="/_blob/c682cf515b74bfe3dfb45e5269693580" alt="Friends sharing dishes across a table" style="width: 100%; height: 100%; object-fit: cover; object-position: center 55%; display: block">
</sc-if>
<sc-if value="{{usePlaceholder}}" hint-placeholder-val="{{true}}">
<div role="img" aria-label="Photo placeholder: friends' hands reaching for dishes on a shared table" style="width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #5E5A52">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#5E5A52" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"></rect><path d="M8 6l1.5-2h5L16 6"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
<span style="font-size: 14px; font-weight: 800">Shared-meal photo</span>
<span style="font-size: 12px; font-weight: 600">Hands reaching across a shared table</span>
</div>
</sc-if>
</div>

<h1 style="margin: 20px 0 0; font-size: 40px; line-height: 1.05; font-weight: 800; letter-spacing: -0.03em">Where are we eating?</h1>
<p style="margin: 8px 0 0; font-size: 17px; line-height: 1.45; font-weight: 500; color: #5E6168">Pick a place together. Skip the group chat debate.</p>

<ol aria-label="How it works" style="list-style: none; margin: 20px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<li style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<span style="width: 32px; height: 32px; border-radius: 10px; background: #F1EFEA; display: flex; align-items: center; justify-content: center" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#17181A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="16" rx="3"></rect><path d="M2 9l2 3-2 3M22 9l-2 3 2 3"></path></svg></span>
<span style="font-size: 13px; line-height: 1.3; font-weight: 600; color: #3D4047">Swipe on spots</span>
</li>
<li style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<span style="width: 32px; height: 32px; border-radius: 10px; background: #F1EFEA; display: flex; align-items: center; justify-content: center" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#17181A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M4 6h.01M4 12h.01M4 18h.01"></path></svg></span>
<span style="font-size: 13px; line-height: 1.3; font-weight: 600; color: #3D4047">Rank favorites</span>
</li>
<li style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<span style="width: 32px; height: 32px; border-radius: 10px; background: #F1EFEA; display: flex; align-items: center; justify-content: center" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#17181A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.8-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 15.2 12 21 12 21z"></path><circle cx="12" cy="9.8" r="2.3"></circle></svg></span>
<span style="font-size: 13px; line-height: 1.3; font-weight: 600; color: #3D4047">Get your pick</span>
</li>
</ol>

<div style="margin-top: 24px; display: flex; flex-direction: column; gap: 10px">
<button style="height: 56px; flex-shrink: 0; border-radius: 18px; border: none; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 12px rgba(210, 67, 42, 0.20)">Start a group</button>
<button style="height: 50px; flex-shrink: 0; border-radius: 18px; border: 1.5px solid #E7E5E0; background: #FFFFFF; color: #17181A; font-size: 16px; font-weight: 700; cursor: pointer">Join with a code</button>
<p style="margin: -2px 0 0; text-align: center; font-size: 13px; font-weight: 500; color: #5E6168">No account needed. Invite friends by link.</p>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"hero":{"editor":"enum","options":["placeholder","current photo"],"default":"placeholder"},"accent":{"editor":"color","default":"#D2432A","options":["#D2432A","#C2410C","#B4232F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var usePhoto = (this.props.hero ?? 'placeholder') === 'current photo';
    return {
      accent: this.props.accent ?? '#D2432A',
      usePhoto: usePhoto,
      usePlaceholder: !usePhoto
    };
  }
}
</script>
</body>
</html>
