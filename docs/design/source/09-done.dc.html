<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Waiting for the group</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#B33A22}a:hover{color:#8F2D1A}
button,input{font-family:inherit}
button:disabled{opacity:.42;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #17181A;outline-offset:3px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #FAF9F6; color: #17181A; font-family: Manrope, 'Helvetica Neue', Arial, sans-serif">

<div style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 13px; font-weight: 600; color: #5E6168">Friday dinner</span>
<span style="height: 32px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(23, 24, 26, 0.08); display: flex; align-items: center; font-size: 13px; font-weight: 700">{{stageLabel}}</span>
</div>

<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 14px; padding-top: 8px">
<span style="width: 64px; height: 64px; border-radius: 22px; background: #FBEAE6; display: flex; align-items: center; justify-content: center" aria-hidden="true">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#B33A22" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 34px; line-height: 1.08; font-weight: 800; letter-spacing: -0.02em">{{title}}</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.45; font-weight: 500; color: #5E6168">{{subtitle}}</p>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 22px; padding: 18px; box-shadow: 0 1px 3px rgba(23, 24, 26, 0.07); display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 style="margin: 0; font-size: 17px; font-weight: 800">The group</h2>
<span style="font-size: 14px; font-weight: 700">3 of 4 done</span>
</div>
<div role="progressbar" aria-label="Friends finished" aria-valuemin="0" aria-valuemax="4" aria-valuenow="3" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<span style="height: 6px; border-radius: 999px; background: {{accent}}"></span>
<span style="height: 6px; border-radius: 999px; background: {{accent}}"></span>
<span style="height: 6px; border-radius: 999px; background: {{accent}}"></span>
<span style="height: 6px; border-radius: 999px; background: #ECEAE5"></span>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<li style="display: flex; align-items: center; gap: 12px; min-height: 52px">
<span style="width: 36px; height: 36px; border-radius: 999px; background: #17181A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800" aria-hidden="true">You</span>
<span style="flex: 1; font-size: 16px; font-weight: 700">You</span>
<span style="display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; color: #2E6B57"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2E6B57" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Done</span>
</li>
<li style="display: flex; align-items: center; gap: 12px; min-height: 52px">
<span style="width: 36px; height: 36px; border-radius: 999px; background: #2F6F8F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800" aria-hidden="true">MK</span>
<span style="flex: 1; font-size: 16px; font-weight: 700">Maya</span>
<span style="display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; color: #2E6B57"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2E6B57" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Done</span>
</li>
<li style="display: flex; align-items: center; gap: 12px; min-height: 52px">
<span style="width: 36px; height: 36px; border-radius: 999px; background: #6B4FA0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800" aria-hidden="true">TJ</span>
<span style="flex: 1; font-size: 16px; font-weight: 700">Tyler</span>
<span style="display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; color: #2E6B57"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2E6B57" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Done</span>
</li>
<li style="display: flex; align-items: center; gap: 12px; min-height: 52px">
<span style="width: 36px; height: 36px; border-radius: 999px; background: #2E7A64; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800" aria-hidden="true">NB</span>
<span style="flex: 1; font-size: 16px; font-weight: 700">Nia</span>
<span style="font-size: 13px; font-weight: 700; color: #5E6168">{{pendingLabel}}</span>
</li>
</ul>
<p style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #5E6168"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5E6168" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Nobody can see anyone’s votes.</p>
</div>

<div style="display: flex; gap: 12px; align-items: flex-start; padding: 0 2px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17181A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
<p style="margin: 0; font-size: 15px; line-height: 1.45; font-weight: 600">{{nextStep}}</p>
</div>

</div>

<div style="flex-shrink: 0; padding: 14px 20px 24px; background: #FAF9F6; box-shadow: 0 -1px 0 #ECEAE5; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; color: #5E6168">Host controls</span>
<button style="height: 52px; border-radius: 18px; border: 1.5px solid #E2E0DB; background: #FFFFFF; color: #17181A; font-size: 16px; font-weight: 700; cursor: pointer">{{hostAction}}</button>
<p style="margin: 0; text-align: center; font-size: 13px; font-weight: 500; color: #5E6168">{{hostNote}}</p>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["picking","ranking"],"default":"picking"},"accent":{"editor":"color","default":"#D2432A","options":["#D2432A","#C2410C","#B4232F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var ranking = (this.props.mode ?? 'picking') === 'ranking';
    return {
      accent: this.props.accent ?? '#D2432A',
      stageLabel: ranking ? 'Ranking' : 'Picking',
      title: ranking ? 'Your ranking is in' : 'You’re done picking',
      subtitle: ranking ? 'Saved. Sit tight while the last ranking comes in.' : 'You went through all 12 spots. Nice.',
      pendingLabel: ranking ? 'Still ranking' : 'Still picking',
      nextStep: ranking ? 'Once everyone has ranked, we’ll announce where you’re eating.' : 'Once everyone finishes, the spots the group liked become finalists, and you’ll rank them.',
      hostAction: ranking ? 'Decide without Nia' : 'End picking for everyone',
      hostNote: ranking ? 'The winner is picked from the rankings already in.' : 'Spots Nia hasn’t seen will count as a no from her.'
    };
  }
}
</script>
</body>
</html>
