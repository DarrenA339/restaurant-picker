<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How should the group decide?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#B33A22}a:hover{color:#8F2D1A}
button,input{font-family:inherit}
button:disabled{opacity:.42;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #17181A;outline-offset:3px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #FAF9F6; color: #17181A; font-family: Manrope, 'Helvetica Neue', Arial, sans-serif">

<div aria-hidden="true" style="position: absolute; inset: 0; padding: 60px 20px 0; box-sizing: border-box">
<div style="font-size: 32px; font-weight: 800; letter-spacing: -0.02em">Friday dinner</div>
<div style="margin-top: 6px; font-size: 16px; color: #5E6168">Add the spots you want. Everyone’s adds go first.</div>
<div style="margin-top: 18px; height: 56px; border-radius: 18px; background: #FFFFFF"></div>
<div style="margin-top: 18px; height: 300px; border-radius: 22px; background: #FFFFFF"></div>
</div>
<div style="position: absolute; inset: 0; background: rgba(23, 24, 26, 0.45)" aria-hidden="true"></div>

<div role="dialog" aria-modal="true" aria-labelledby="vm-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 26px 26px 0 0; display: flex; flex-direction: column; max-height: 720px">
<div style="height: 22px; flex-shrink: 0; display: flex; justify-content: center; align-items: center"><span style="width: 40px; height: 5px; border-radius: 999px; background: #D9D6CF" aria-hidden="true"></span></div>
<div style="padding: 0 12px 0 20px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px; padding-top: 4px">
<h2 id="vm-title" style="margin: 0; font-size: 24px; line-height: 1.15; font-weight: 800; letter-spacing: -0.01em">How should the group decide?</h2>
<p style="margin: 0; font-size: 14px; line-height: 1.4; font-weight: 500; color: #5E6168">This is for the final round. It locks when picking starts.</p>
</div>
<a href="LobbyV2.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #F1EFEA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#17181A" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<div role="radiogroup" aria-labelledby="vm-title" style="padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto">
<sc-for list="{{methods}}" as="item" hint-placeholder-count="3">
<button role="radio" aria-checked="{{item.checked}}" onClick="{{item.pick}}" style="width: 100%; text-align: left; border-radius: 20px; border: 2px solid {{item.border}}; background: {{item.bg}}; padding: 16px; display: flex; gap: 14px; align-items: flex-start; cursor: pointer; color: #17181A">
<span style="width: 22px; height: 22px; flex-shrink: 0; margin-top: 2px; border-radius: 999px; border: 2px solid {{item.ring}}; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><span style="width: 10px; height: 10px; border-radius: 999px; background: {{item.dot}}"></span></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px"><span style="font-size: 17px; font-weight: 800">{{item.name}}</span><span style="font-size: 12px; font-weight: 700; color: #5E6168; white-space: nowrap">{{item.tech}}</span></span>
<span style="font-size: 14px; line-height: 1.45; font-weight: 500; color: #3D4047">{{item.how}}</span>
<span style="font-size: 13px; font-weight: 700; color: #5E6168">{{item.best}}</span>
</span>
</button>
</sc-for>
</div>

<div style="padding: 12px 20px 24px; box-shadow: 0 -1px 0 #ECEAE5; display: flex; flex-direction: column; gap: 8px">
<a href="LobbyV2.dc.html" style="height: 56px; border-radius: 18px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(210, 67, 42, 0.20)">{{saveLabel}}</a>
<p style="margin: 0; text-align: center; font-size: 13px; font-weight: 500; color: #5E6168">Everyone sees the method in the lobby before picking starts.</p>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D2432A","options":["#D2432A","#C2410C","#B4232F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var s = this.state || {};
    var self = this;
    var accent = this.props.accent ?? '#D2432A';
    var choice = s.choice || 'borda';
    var list = [
      { id: 'plurality', name: 'One vote each', tech: 'Plurality', how: 'Everyone picks one favorite. Most votes wins.', best: 'Fastest. Best when you just need an answer.' },
      { id: 'borda', name: 'Ranked points', tech: 'Borda count', how: 'Everyone ranks the finalists. First place gets the most points.', best: 'Rewards spots most people like. The default.' },
      { id: 'quadratic', name: 'Quadratic votes', tech: 'Quadratic voting', how: 'Everyone spreads 9 credits. 1 vote costs 1, 2 votes cost 4, 3 cost 9.', best: 'Lets strong favorites show without anyone taking over.' }
    ];
    var picked = list.filter(function (m) { return m.id === choice; })[0];
    return {
      accent: accent,
      saveLabel: 'Use ' + picked.name.toLowerCase(),
      methods: list.map(function (m) {
        var on = m.id === choice;
        return {
          name: m.name, tech: m.tech, how: m.how, best: m.best,
          checked: on ? 'true' : 'false',
          border: on ? accent : '#ECEAE5',
          bg: on ? '#FFF7F5' : '#FFFFFF',
          ring: on ? accent : '#B9BBC0',
          dot: on ? accent : 'transparent',
          pick: function () { self.setState({ choice: m.id }); }
        };
      })
    };
  }
}
</script>
</body>
</html>
