<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set up dinner</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#B33A22}a:hover{color:#8F2D1A}
button,input{font-family:inherit}
button:disabled{opacity:.42;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #17181A;outline-offset:3px}
input:focus{border-color:#17181A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #FAF9F6; color: #17181A; font-family: Manrope, 'Helvetica Neue', Arial, sans-serif">

<div style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; flex-direction: column; gap: 10px">
<button aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; border-radius: 999px; border: none; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17181A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<h1 style="margin: 0; font-size: 30px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">Set up dinner</h1>
<p style="margin: 0; font-size: 15px; font-weight: 500; color: #5E6168">Takes about 20 seconds. You can tweak it in the lobby.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="session-name" style="font-size: 14px; font-weight: 700">Session name</label>
<input id="session-name" type="text" defaultValue="Friday dinner" style="height: 52px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid #E2E0DB; background: #FFFFFF; padding: 0 16px; font-size: 16px; font-weight: 600; color: #17181A">
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="start-area" style="font-size: 14px; font-weight: 700">Starting area</label>
<div style="height: 52px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid #E2E0DB; background: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 14px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6168" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.8-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 15.2 12 21 12 21z"></path><circle cx="12" cy="9.8" r="2.3"></circle></svg>
<input id="start-area" type="text" defaultValue="Harvard Square, Cambridge" style="flex: 1; min-width: 0; height: 44px; border: none; background: transparent; font-size: 16px; font-weight: 600; color: #17181A">
<button style="height: 40px; padding: 0 12px; border-radius: 10px; border: none; background: #F1EFEA; color: #17181A; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#17181A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"></path></svg>Use mine
</button>
</div>
<p style="margin: 0; font-size: 13px; font-weight: 500; color: #5E6168">We search around here until friends join.</p>
</div>

<div role="radiogroup" aria-labelledby="distance-label" style="display: flex; flex-direction: column; gap: 10px">
<span id="distance-label" style="font-size: 14px; font-weight: 700">How far will you go?</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{distances}}" as="item" hint-placeholder-count="4">
<button role="radio" aria-checked="{{item.checked}}" onClick="{{item.pick}}" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid {{item.border}}; background: {{item.bg}}; color: {{item.fg}}; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer">{{item.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 700">Price <span style="font-weight: 500; color: #5E6168">Pick all that work</span></span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{prices}}" as="item" hint-placeholder-count="4">
<button aria-pressed="{{item.pressed}}" aria-label="{{item.aria}}" onClick="{{item.toggle}}" style="height: 44px; min-width: 64px; padding: 0 16px; border-radius: 999px; border: 1.5px solid {{item.border}}; background: {{item.bg}}; color: {{item.fg}}; font-size: 15px; font-weight: 700; cursor: pointer">{{item.label}}</button>
</sc-for>
</div>
</div>

<div style="border-radius: 18px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(23, 24, 26, 0.07); overflow: hidden">
<button onClick="{{toggleMore}}" aria-expanded="{{moreOpen}}" aria-controls="more-prefs" style="width: 100%; min-height: 60px; padding: 0 16px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700; color: #17181A">More preferences</span><span style="font-size: 13px; font-weight: 500; color: #5E6168">{{moreSummary}}</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17181A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{chevron}}; transition: transform 200ms ease"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<sc-if value="{{moreOpen}}" hint-placeholder-val="{{false}}">
<div id="more-prefs" style="padding: 4px 16px 18px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 700">Cuisine <span style="font-weight: 500; color: #5E6168">Optional</span></span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{cuisines}}" as="item" hint-placeholder-count="6">
<button aria-pressed="{{item.pressed}}" onClick="{{item.toggle}}" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid {{item.border}}; background: {{item.bg}}; color: {{item.fg}}; font-size: 14px; font-weight: 700; cursor: pointer">{{item.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 700">Must have</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{musts}}" as="item" hint-placeholder-count="2">
<button aria-pressed="{{item.pressed}}" onClick="{{item.toggle}}" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid {{item.border}}; background: {{item.bg}}; color: {{item.fg}}; font-size: 14px; font-weight: 700; cursor: pointer">{{item.label}}</button>
</sc-for>
</div>
</div>
</div>
</sc-if>
</div>

</div>

<div style="flex-shrink: 0; padding: 12px 20px 24px; background: #FAF9F6; box-shadow: 0 -1px 0 #ECEAE5">
<button style="width: 100%; height: 56px; border-radius: 18px; border: none; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 800; cursor: pointer; box-shadow: 0 6px 16px rgba(210, 67, 42, 0.24)">Create session</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D2432A","options":["#D2432A","#C2410C","#B4232F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var s = this.state || {};
    var self = this;
    var on = { bg: '#17181A', fg: '#FFFFFF', border: '#17181A' };
    var off = { bg: '#FFFFFF', fg: '#17181A', border: '#E2E0DB' };
    var distance = s.distance || '2 mi';
    var prices = s.prices || { '$': true, '$$': true };
    var cuisines = s.cuisines || {};
    var musts = s.musts || { 'Open now': true };
    var moreOpen = !!s.moreOpen;
    var toggleIn = function (key, obj, label) {
      var next = Object.assign({}, obj);
      if (next[label]) { delete next[label]; } else { next[label] = true; }
      var patch = {};
      patch[key] = next;
      self.setState(patch);
    };
    var chip = function (isOn) { return isOn ? on : off; };
    var priceNames = { '$': 'Inexpensive', '$$': 'Moderate', '$$$': 'Expensive', '$$$$': 'Very expensive' };
    var cuisineList = ['Korean', 'Japanese', 'Mexican', 'Thai', 'Italian', 'Indian', 'Mediterranean', 'Pizza'];
    var mustList = ['Open now', 'Vegetarian options'];
    var picked = cuisineList.filter(function (c) { return cuisines[c]; });
    var pickedMust = mustList.filter(function (m) { return musts[m]; });
    var summaryParts = [];
    summaryParts.push(picked.length ? picked.join(', ') : 'Any cuisine');
    if (pickedMust.length) { summaryParts.push(pickedMust.join(', ').toLowerCase()); }
    return {
      accent: this.props.accent ?? '#D2432A',
      moreOpen: moreOpen,
      chevron: moreOpen ? 'rotate(180deg)' : 'none',
      moreSummary: summaryParts.join(', '),
      toggleMore: function () { self.setState({ moreOpen: !moreOpen }); },
      distances: ['0.5 mi', '1 mi', '2 mi', '5 mi'].map(function (d) {
        var c = chip(d === distance);
        return { label: d, checked: d === distance ? 'true' : 'false', bg: c.bg, fg: c.fg, border: c.border, pick: function () { self.setState({ distance: d }); } };
      }),
      prices: ['$', '$$', '$$$', '$$$$'].map(function (p) {
        var c = chip(!!prices[p]);
        return { label: p, aria: priceNames[p], pressed: prices[p] ? 'true' : 'false', bg: c.bg, fg: c.fg, border: c.border, toggle: function () { toggleIn('prices', prices, p); } };
      }),
      cuisines: cuisineList.map(function (q) {
        var c = chip(!!cuisines[q]);
        return { label: q, pressed: cuisines[q] ? 'true' : 'false', bg: c.bg, fg: c.fg, border: c.border, toggle: function () { toggleIn('cuisines', cuisines, q); } };
      }),
      musts: mustList.map(function (m) {
        var c = chip(!!musts[m]);
        return { label: m, pressed: musts[m] ? 'true' : 'false', bg: c.bg, fg: c.fg, border: c.border, toggle: function () { toggleIn('musts', musts, m); } };
      })
    };
  }
}
</script>
</body>
</html>
