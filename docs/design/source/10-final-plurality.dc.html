<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick your favorite</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#B33A22}a:hover{color:#8F2D1A}
button,input{font-family:inherit}
button:disabled{opacity:.42;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #17181A;outline-offset:3px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; position: relative; background: #FAF9F6; color: #17181A; font-family: Manrope, 'Helvetica Neue', Arial, sans-serif">

<div style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 13px; font-weight: 600; color: #5E6168">Friday dinner</span>
<span style="height: 32px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(23, 24, 26, 0.08); display: flex; align-items: center; font-size: 13px; font-weight: 700">One vote each</span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<h1 id="pl-title" style="margin: 0; font-size: 32px; line-height: 1.08; font-weight: 800; letter-spacing: -0.02em">Pick your favorite</h1>
<p style="margin: 0; font-size: 15px; font-weight: 500; color: #5E6168">3 finalists. Most votes wins.</p>
</div>

<div role="radiogroup" aria-labelledby="pl-title" style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{rows}}" as="item" hint-placeholder-count="3">
<button role="radio" aria-checked="{{item.checked}}" onClick="{{item.pick}}" disabled="{{locked}}" style="width: 100%; text-align: left; display: flex; align-items: center; gap: 14px; background: #FFFFFF; border-radius: 20px; padding: 10px 16px 10px 10px; border: 2px solid {{item.border}}; box-shadow: {{item.shadow}}; cursor: pointer; color: #17181A">
<span style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 16px; overflow: hidden; background: {{item.tone}}" aria-hidden="true">
<sc-if value="{{item.real}}" hint-placeholder-val="{{false}}"><img src="/_blob/c682cf515b74bfe3dfb45e5269693580" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></sc-if>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 18px; line-height: 1.2; font-weight: 800">{{item.name}}</span>
<span style="font-size: 13px; font-weight: 600; color: #5E6168">{{item.meta}}</span>
</span>
<span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 999px; border: 2px solid {{item.ring}}; display: flex; align-items: center; justify-content: center; box-sizing: border-box" aria-hidden="true"><span style="width: 12px; height: 12px; border-radius: 999px; background: {{item.dot}}"></span></span>
</button>
</sc-for>
</div>

<p style="margin: 0; font-size: 13px; line-height: 1.45; font-weight: 500; color: #5E6168">If two spots tie, the one more people said yes to wins.</p>

</div>

<div style="flex-shrink: 0; padding: 14px 20px 24px; background: #FAF9F6; box-shadow: 0 -1px 0 #ECEAE5">
<sc-if value="{{notSaved}}" hint-placeholder-val="{{true}}">
<button onClick="{{submit}}" disabled="{{submitDisabled}}" aria-busy="{{saving}}" style="width: 100%; height: 56px; border-radius: 18px; border: none; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; box-shadow: 0 4px 12px rgba(210, 67, 42, 0.20)">
<sc-if value="{{saving}}" hint-placeholder-val="{{false}}"><svg class="spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" aria-hidden="true" style="animation: spin 800ms linear infinite"><path d="M12 3a9 9 0 1 0 9 9"></path></svg></sc-if>{{submitLabel}}
</button>
</sc-if>
<sc-if value="{{saved}}" hint-placeholder-val="{{false}}">
<a href="Done.dc.html" style="height: 56px; border-radius: 18px; background: #17181A; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Vote in. See the group</a>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D2432A","options":["#D2432A","#C2410C","#B4232F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var s = this.state || {};
    var self = this;
    var accent = this.props.accent ?? '#D2432A';
    var choice = s.choice || null;
    var status = s.status || 'idle';
    var locked = status !== 'idle';
    var list = [
      { id: 'juniper', name: 'Juniper & Rice', meta: 'Korean · $$ · 0.7 mi', real: true, tone: '#E9E4DA' },
      { id: 'tanuki', name: 'Tanuki Noodle House', meta: 'Japanese · $$ · 0.4 mi', real: false, tone: '#EDE3D3' },
      { id: 'verbena', name: 'Casa Verbena', meta: 'Mexican · $ · 0.9 mi', real: false, tone: '#F0DED6' }
    ];
    var picked = list.filter(function (r) { return r.id === choice; })[0];
    return {
      accent: accent,
      locked: locked,
      saving: status === 'saving',
      saved: status === 'saved',
      notSaved: status !== 'saved',
      submitDisabled: !choice || locked,
      submitLabel: status === 'saving' ? 'Saving' : (picked ? 'Vote for ' + picked.name : 'Pick one to vote'),
      submit: function () {
        if (!choice || status !== 'idle') { return; }
        self.setState({ status: 'saving' });
        setTimeout(function () { self.setState({ status: 'saved' }); }, 900);
      },
      rows: list.map(function (r) {
        var on = r.id === choice;
        return {
          name: r.name, meta: r.meta, real: r.real, tone: r.tone,
          checked: on ? 'true' : 'false',
          border: on ? accent : '#FFFFFF',
          shadow: on ? '0 10px 28px rgba(23, 24, 26, 0.10)' : '0 1px 3px rgba(23, 24, 26, 0.08)',
          ring: on ? accent : '#B9BBC0',
          dot: on ? accent : 'transparent',
          pick: function () { if (!locked) { self.setState({ choice: r.id }); } }
        };
      })
    };
  }
}
</script>
</body>
</html>
