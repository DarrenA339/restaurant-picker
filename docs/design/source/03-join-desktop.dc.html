<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join Friday dinner, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#B33A22}a:hover{color:#8F2D1A}
button,input{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #17181A;outline-offset:3px}
input:focus{border-color:#17181A}
</style>
</helmet>
<div style="width: 100%; min-height: 800px; height: 100vh; box-sizing: border-box; background: #FAF9F6; color: #17181A; font-family: Manrope, 'Helvetica Neue', Arial, sans-serif; overflow: auto">

<header style="width: 100%; max-width: 1104px; margin: 0 auto; box-sizing: border-box; padding: 28px 32px 0; display: flex; align-items: center; gap: 10px">
<span style="width: 36px; height: 36px; border-radius: 11px; background: {{accent}}; display: flex; align-items: center; justify-content: center" aria-hidden="true">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v7a2 2 0 0 0 2 2M9 3v18M11 3v7a2 2 0 0 1-2 2M17 21V3c-2.2 1.2-3.5 3.6-3.5 6.5V13H17"></path></svg>
</span>
<span style="font-size: 19px; font-weight: 800; letter-spacing: -0.01em">[APP NAME]</span>
</header>

<main style="width: 100%; max-width: 480px; margin: 0 auto; box-sizing: border-box; padding: 40px 0 56px; display: flex; flex-direction: column; gap: 24px">

<div style="background: #FFFFFF; border-radius: 26px; padding: 24px; box-shadow: 0 12px 32px rgba(23, 24, 26, 0.07); display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px">
<div style="display: flex; align-items: center; flex-shrink: 0" role="img" aria-label="Maya, Sam and Tyler have joined">
<span style="width: 34px; height: 34px; border-radius: 999px; background: #2F6F8F; color: #FFFFFF; border: 2.5px solid #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">MK</span>
<span style="width: 34px; height: 34px; margin-left: -9px; border-radius: 999px; background: #17181A; color: #FFFFFF; border: 2.5px solid #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">SR</span>
<span style="width: 34px; height: 34px; margin-left: -9px; border-radius: 999px; background: #6B4FA0; color: #FFFFFF; border: 2.5px solid #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">TJ</span>
</div>
<span style="font-size: 14px; font-weight: 600; color: #5E6168">Maya, Sam and Tyler are in</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 15px; font-weight: 600; color: #5E6168">Maya invited you to</p>
<h1 style="margin: 0; font-size: 38px; line-height: 1.06; font-weight: 800; letter-spacing: -0.02em">Friday dinner</h1>
</div>
<p style="margin: 0; font-size: 14px; font-weight: 500; color: #5E6168">Near Harvard Square, up to 2 mi, $ to $$</p>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<label for="jd-name" style="font-size: 14px; font-weight: 700">What should friends call you?</label>
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 999px; background: #2E7A64; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800" aria-hidden="true">NI</span>
<input id="jd-name" type="text" defaultValue="Nia" style="flex: 1; min-width: 0; height: 52px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid #E2E0DB; background: #FFFFFF; padding: 0 16px; font-size: 16px; font-weight: 600; color: #17181A">
</div>
<div role="radiogroup" aria-label="Avatar color" style="display: flex; align-items: center; gap: 4px">
<span style="font-size: 13px; font-weight: 600; color: #5E6168; margin-right: 6px">Color</span>
<button role="radio" aria-checked="true" aria-label="Green" style="width: 44px; height: 44px; border: none; background: none; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 28px; height: 28px; border-radius: 999px; background: #2E7A64; box-shadow: 0 0 0 2.5px #FAF9F6, 0 0 0 4.5px #17181A"></span></button>
<button role="radio" aria-checked="false" aria-label="Rust" style="width: 44px; height: 44px; border: none; background: none; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 28px; height: 28px; border-radius: 999px; background: #A4532E"></span></button>
<button role="radio" aria-checked="false" aria-label="Plum" style="width: 44px; height: 44px; border: none; background: none; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 28px; height: 28px; border-radius: 999px; background: #8E3B6B"></span></button>
<button role="radio" aria-checked="false" aria-label="Slate" style="width: 44px; height: 44px; border: none; background: none; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 28px; height: 28px; border-radius: 999px; background: #3E5C76"></span></button>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 18px; box-shadow: 0 1px 3px rgba(23, 24, 26, 0.07); display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #F1EFEA; display: flex; align-items: center; justify-content: center" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17181A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8z"></path></svg></span>
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 15px; font-weight: 700">Show distances from you</span>
<span style="font-size: 14px; line-height: 1.4; font-weight: 500; color: #5E6168">Friends see your rough area on the map, never your exact address.</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
<button style="height: 44px; padding: 0 16px; border-radius: 14px; border: 1.5px solid #E2E0DB; background: #FFFFFF; color: #17181A; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap">Share my location</button>
<button style="height: 36px; padding: 0 2px; border: none; background: none; color: #B33A22; font-size: 13px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; white-space: nowrap">Enter an area instead</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px">
<button style="height: 56px; border-radius: 18px; border: none; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 12px rgba(210, 67, 42, 0.20)">Join dinner</button>
<p style="margin: 0; text-align: center; font-size: 13px; font-weight: 500; color: #5E6168">No account needed</p>
</div>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D2432A","options":["#D2432A","#C2410C","#B4232F"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#D2432A' };
  }
}
</script>
</body>
</html>
